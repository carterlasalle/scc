# trace:exempt reason=infra-config  # image publishing declaration, not repo behavior
name: Publish image

# Publishes the daemon image to GitHub Container Registry. GHCR needs no
# secrets: the workflow's own GITHUB_TOKEN with `packages: write` is enough, and
# the Dockerfile's org.opencontainers.image.source label links the package back
# to this repository.
#
#   docker pull ghcr.io/carterlasalle/scc:latest
#   docker run --rm ghcr.io/carterlasalle/scc --version
#
# Tags: main -> :latest and :edge; vX.Y.Z -> :vX.Y.Z, :X.Y.Z and :latest.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: carterlasalle/scc

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          base="${REGISTRY}/${IMAGE}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            tags="${base}:${GITHUB_REF_NAME},${base}:${ver},${base}:latest"
          else
            tags="${base}:edge,${base}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "primary=${base}:latest" >> "$GITHUB_OUTPUT"
          echo "tags: ${tags}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build is not proof the image runs. Pull what was actually
      # pushed (anonymous credentials) and exercise both entry points.
      - name: Smoke — pull the pushed image
        run: |
          docker pull "${{ steps.tags.outputs.primary }}"
          docker run --rm "${{ steps.tags.outputs.primary }}" --version
          docker run --rm "${{ steps.tags.outputs.primary }}" languages | head -5

      - name: Smoke — MCP server over stdio
        run: |
          # The image ships the MCP server; a repository with no index must still
          # answer the protocol handshake rather than crash.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | timeout 60 docker run -i --rm -v "$PWD:/repo:ro" -e SCC_STATE_DIR=/tmp/scc-state \
                "${{ steps.tags.outputs.primary }}" mcp > /tmp/mcp-out.txt 2>/tmp/mcp-err.txt || true
          if grep -q '"serverInfo"' /tmp/mcp-out.txt; then
            echo "MCP handshake answered:"
            head -c 400 /tmp/mcp-out.txt
          else
            echo "no MCP handshake response; stdout:" >&2
            head -20 /tmp/mcp-out.txt >&2
            echo "stderr:" >&2
            head -20 /tmp/mcp-err.txt >&2
            exit 1
          fi
