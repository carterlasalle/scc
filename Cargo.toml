[workspace]
resolver = "2"
members = [
    "crates/scc-core",
    "crates/scc-store",
    "crates/scc-indexer",
    "crates/scc-graph",
    "crates/scc-context",
    "crates/scc-cli",
]

[workspace.package]
# trace:v1 id=ops.release-version work=WORK-SI-MMMJA4G6 satisfies=REQ-SI-503JSBGP
version = "0.2.6"
edition = "2021"
license = "MIT"
# trace:exempt reason=package-metadata
authors = ["Carter LaSalle <carterlasalle@users.noreply.github.com>"]
# trace:exempt reason=package-metadata
repository = "https://github.com/carterlasalle/scc"
# trace:exempt reason=package-metadata
homepage = "https://github.com/carterlasalle/scc#readme"
# trace:exempt reason=package-metadata
keywords = ["ai-agents", "context-engineering", "code-intelligence", "mcp", "tree-sitter"]
# trace:exempt reason=package-metadata
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# `version` must match [workspace.package] version: crates.io cannot resolve a
# path-only dependency. contrib/publish-crates.sh asserts they agree.
# trace:exempt reason=package-metadata
scc-core = { path = "crates/scc-core", version = "0.2.6" }
# trace:exempt reason=package-metadata
scc-store = { path = "crates/scc-store", version = "0.2.6" }
# trace:exempt reason=package-metadata
scc-indexer = { path = "crates/scc-indexer", version = "0.2.6" }
# trace:exempt reason=package-metadata
scc-graph = { path = "crates/scc-graph", version = "0.2.6" }
# trace:exempt reason=package-metadata
scc-context = { path = "crates/scc-context", version = "0.2.6" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"

[profile.profiling]
# trace:exempt reason=internal-detail
inherits = "release"
# Symbolized profiling build: full line tables, never stripped, so Samply
# resolves scc frames (release addr-only profiles proved useless 2026-09-21).
# trace:exempt reason=internal-detail
debug = 1
# trace:exempt reason=internal-detail
strip = false
# NOTE (2026-09-21): split-debuginfo=packed does NOT fix samply 0.13.1
# macOS symbolication (tried — still addr-only frames). The scc frames ARE
# in the binary (nm + dtrace flamegraph resolve them); samply-side lookup is
# the gap. Primary recipe stays cargo-flamegraph; retry samply on upgrade.

[profile.dev]
opt-level = 1
