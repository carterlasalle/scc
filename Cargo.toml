[workspace]
resolver = "2"
members = [
    "crates/scc-core",
    "crates/scc-store",
    "crates/scc-indexer",
    "crates/scc-graph",
    "crates/scc-context",
    "crates/scc-cli",
]

[workspace.package]
# trace:v1 id=ops.release-version work=WORK-SI-MMMJA4G6 satisfies=REQ-SI-503JSBGP
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
scc-core = { path = "crates/scc-core" }
scc-store = { path = "crates/scc-store" }
scc-indexer = { path = "crates/scc-indexer" }
scc-graph = { path = "crates/scc-graph" }
scc-context = { path = "crates/scc-context" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
