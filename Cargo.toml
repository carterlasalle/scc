[workspace]
# trace:exempt reason=internal-detail
resolver = "2"
# trace:exempt reason=internal-detail
members = [
    "crates/scc-core",
    "crates/scc-store",
    "crates/scc-indexer",
    "crates/scc-graph",
    "crates/scc-context",
    "crates/scc-api",
    "crates/scc-engine",
    "crates/scc-ffi",
    "crates/scc-plugin-api",
    "crates/scc-plugin-host",
    "crates/scc-cli",
]

[workspace.package]
# trace:v1 id=ops.release-version work=WORK-SI-MMMJA4G6 satisfies=REQ-SI-503JSBGP
version = "0.2.7"
# trace:exempt reason=internal-detail
edition = "2021"
# trace:exempt reason=internal-detail
license = "MIT"
# trace:exempt reason=package-metadata
authors = ["Carter LaSalle <carterlasalle@users.noreply.github.com>"]
# trace:exempt reason=package-metadata
repository = "https://github.com/carterlasalle/scc"
# trace:exempt reason=package-metadata
homepage = "https://github.com/carterlasalle/scc#readme"
# trace:exempt reason=package-metadata
keywords = ["ai-agents", "context-engineering", "code-intelligence", "mcp", "tree-sitter"]
# trace:exempt reason=package-metadata
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# `version` pins below are crates.io requirements (contrib/publish-crates.sh
# asserts path deps carry the workspace version); new engine/plugin crates
# stay path-only until published.
# trace:exempt reason=package-metadata
scc-core = { path = "crates/scc-core", version = "0.2.7" }
# trace:exempt reason=package-metadata
scc-store = { path = "crates/scc-store", version = "0.2.7" }
# trace:exempt reason=package-metadata
scc-indexer = { path = "crates/scc-indexer", version = "0.2.7" }
# trace:exempt reason=package-metadata
scc-graph = { path = "crates/scc-graph", version = "0.2.7" }
# trace:exempt reason=package-metadata
scc-context = { path = "crates/scc-context", version = "0.2.7" }
# trace:exempt reason=internal-detail
scc-api = { path = "crates/scc-api", version = "0.2.7" }
# trace:exempt reason=internal-detail
scc-engine = { path = "crates/scc-engine", version = "0.2.7" }
# trace:exempt reason=internal-detail
scc-ffi = { path = "crates/scc-ffi", version = "0.2.7" }
# trace:exempt reason=internal-detail
scc-plugin-api = { path = "crates/scc-plugin-api", version = "0.2.7" }
# trace:exempt reason=internal-detail
scc-plugin-host = { path = "crates/scc-plugin-host", version = "0.2.7" }

# trace:exempt reason=internal-detail
serde = { version = "1", features = ["derive"] }
# trace:exempt reason=internal-detail
serde_json = "1"
# trace:exempt reason=internal-detail
serde_yaml = "0.9"
# trace:exempt reason=internal-detail
thiserror = "2"
# trace:exempt reason=internal-detail
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
# trace:exempt reason=internal-detail
lto = "thin"

[profile.profiling]
# trace:exempt reason=internal-detail
inherits = "release"
# Symbolized profiling build: full line tables, never stripped, so Samply
# resolves scc frames (release addr-only profiles proved useless 2026-09-21).
# trace:exempt reason=internal-detail
debug = 1
# trace:exempt reason=internal-detail
strip = false
# NOTE (2026-09-21): split-debuginfo=packed does NOT fix samply 0.13.1
# macOS symbolication (tried — still addr-only frames). The scc frames ARE
# in the binary (nm + dtrace flamegraph resolve them); samply-side lookup is
# the gap. Primary recipe stays cargo-flamegraph; retry samply on upgrade.

[profile.dev]
# trace:exempt reason=internal-detail
opt-level = 1
