[workspace]
# trace:exempt reason=internal-detail
resolver = "2"
# trace:exempt reason=internal-detail
members = [
    "crates/scc-core",
    "crates/scc-store",
    "crates/scc-indexer",
    "crates/scc-graph",
    "crates/scc-context",
    "crates/scc-api",
    "crates/scc-engine",
    "crates/scc-ffi",
    "crates/scc-plugin-api",
    "crates/scc-plugin-host",
    "crates/scc-cli",
]

[workspace.package]
# trace:v1 id=ops.release-version work=WORK-SI-MMMJA4G6 satisfies=REQ-SI-503JSBGP
version = "0.2.6"
# trace:exempt reason=internal-detail
edition = "2021"
# trace:exempt reason=internal-detail
license = "MIT"

[workspace.dependencies]
# trace:exempt reason=internal-detail
scc-core = { path = "crates/scc-core" }
# trace:exempt reason=internal-detail
scc-store = { path = "crates/scc-store" }
# trace:exempt reason=internal-detail
scc-indexer = { path = "crates/scc-indexer" }
# trace:exempt reason=internal-detail
scc-graph = { path = "crates/scc-graph" }
# trace:exempt reason=internal-detail
scc-context = { path = "crates/scc-context" }
# trace:exempt reason=internal-detail
scc-api = { path = "crates/scc-api" }
# trace:exempt reason=internal-detail
scc-engine = { path = "crates/scc-engine" }
# trace:exempt reason=internal-detail
scc-ffi = { path = "crates/scc-ffi" }
# trace:exempt reason=internal-detail
scc-plugin-api = { path = "crates/scc-plugin-api" }
# trace:exempt reason=internal-detail
scc-plugin-host = { path = "crates/scc-plugin-host" }

# trace:exempt reason=internal-detail
serde = { version = "1", features = ["derive"] }
# trace:exempt reason=internal-detail
serde_json = "1"
# trace:exempt reason=internal-detail
serde_yaml = "0.9"
# trace:exempt reason=internal-detail
thiserror = "2"
# trace:exempt reason=internal-detail
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
# trace:exempt reason=internal-detail
lto = "thin"

[profile.profiling]
# trace:exempt reason=internal-detail
inherits = "release"
# Symbolized profiling build: full line tables, never stripped, so Samply
# resolves scc frames (release addr-only profiles proved useless 2026-09-21).
# trace:exempt reason=internal-detail
debug = 1
# trace:exempt reason=internal-detail
strip = false
# NOTE (2026-09-21): split-debuginfo=packed does NOT fix samply 0.13.1
# macOS symbolication (tried — still addr-only frames). The scc frames ARE
# in the binary (nm + dtrace flamegraph resolve them); samply-side lookup is
# the gap. Primary recipe stays cargo-flamegraph; retry samply on upgrade.

[profile.dev]
# trace:exempt reason=internal-detail
opt-level = 1
